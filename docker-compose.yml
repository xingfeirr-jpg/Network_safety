# Project 17 deployment.
#
#   cp .env.example .env          # set P17_DATA_DIR (absolute path) and P17_PORT
#   docker compose up -d --build
#
# Services
#   ui               web UI on http://<host>:${P17_PORT}
#   prepare-sources  builds the replication image (project17-replication:1.0) used by live
#                    runs, then downloads and extracts the ten pinned library sources into
#                    the data directory once and exits. Already present sources are skipped.
#
# P17_DATA_DIR is mounted at the SAME absolute path inside the UI container. The UI starts
# replication containers through the host Docker socket, and Docker resolves `-v` paths on
# the host, so the path must mean the same thing on both sides.

x-data-dir: &data_dir ${P17_DATA_DIR:-/srv/project17/data}

services:
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: project17-ui:latest
    container_name: project17-ui
    restart: unless-stopped
    ports:
      - "${P17_PORT:-8000}:8000"
    environment:
      P17_DATA_DIR: *data_dir
      P17_HOST_DATA_DIR: *data_dir
      P17_IMAGE: project17-replication:1.0
    volumes:
      - type: bind
        source: *data_dir
        target: *data_dir
        bind:
          create_host_path: true
      - /var/run/docker.sock:/var/run/docker.sock

  prepare-sources:
    build:
      context: ./Project17_Replication
      args:
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: project17-replication:1.0
    restart: "no"
    entrypoint: ["python3", "/replication/prepare_sources.py"]
    volumes:
      - ${P17_DATA_DIR:-/srv/project17/data}/cache/downloads:/home/yhong/comp5355/downloads
      - ${P17_DATA_DIR:-/srv/project17/data}/cache/sources:/home/yhong/comp5355/sources
      - ./ui/container/prepare_sources.py:/replication/prepare_sources.py:ro
